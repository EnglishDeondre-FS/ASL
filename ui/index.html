<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy, Star, and Planet Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Galaxy, Star, and Planet Management</h1>

  <section id="galaxies-section">
    <h2>Galaxies</h2>
    <ul id="galaxies"></ul>
    <div id="galaxy-info"></div>
    <h3>Create Galaxy</h3>
    <form id="create-galaxy-form">
      <input type="text" id="galaxy-name" placeholder="Galaxy Name">
      <button type="submit">Create Galaxy</button>
    </form>
    <h3>Upload Galaxy Image</h3>
    <form id="galaxy-image-upload-form">
      <input type="file" id="galaxy-image-input">
      <button type="submit">Upload Image</button>
    </form>
  </section>

  <section id="stars-section">
    <h2>Stars</h2>
    <ul id="stars"></ul>
    <div id="star-info"></div>
    <h3>Create Star</h3>
    <form id="create-star-form">
      <input type="text" id="star-name" placeholder="Star Name">
      <button type="submit">Create Star</button>
    </form>
    <h3>Upload Star Image</h3>
    <form id="star-image-upload-form">
      <input type="file" id="star-image-input">
      <button type="submit">Upload Image</button>
    </form>
  </section>

  <section id="planets-section">
    <h2>Planets</h2>
    <ul id="planets"></ul>
    <div id="planet-info"></div>
    <h3>Create Planet</h3>
    <form id="create-planet-form">
      <input type="text" id="planet-name" placeholder="Planet Name">
      <button type="submit">Create Planet</button>
    </form>
    <h3>Upload Planet Image</h3>
    <form id="planet-image-upload-form">
      <input type="file" id="planet-image-input">
      <button type="submit">Upload Image</button>
    </form>
  </section>

  <script type="module" src="script.js"></script>
</body>
</html>
